<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentOps CRM</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body><main><header><p>MISSIONS · DÉMONSTRATION LOCALE</p><h1>AgentOps CRM</h1><p>De la mission planifiée au travail terminé.</p></header><aside>Données synthétiques uniquement. Stockage temporaire : tout est effacé à l’arrêt du serveur.</aside><section><h2>Nouvelle mission</h2><form id="mission-form"><label for="client">Client fictif</label><input id="client" name="client" maxlength="120" required autocomplete="off"><label for="title">Intitulé</label><input id="title" name="title" maxlength="200" required><button type="submit">Créer la mission</button></form><p id="message" role="status" aria-live="polite"></p></section><section><h2>Vos missions</h2><button id="refresh" type="button">Actualiser</button><div id="missions" aria-live="polite"></div></section></main></body></html>
